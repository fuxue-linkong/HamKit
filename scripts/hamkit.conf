server {
                server_name hamkit.click www.hamkit.click;
    gzip_types text/plain text/csv application/csv;

                    root /var/www/hamkit;
                        index index.html;

                            location / {
                                            try_files $uri $uri/ =404;
                                                }

    # TLE 镜像目录：强制 text/plain 类型并开启 gzip，提升客户端下载速度
    location /tle/ {
        default_type text/plain;
        gzip on;
        gzip_types text/plain;
        gzip_min_length 256;
        add_header Cache-Control "public, max-age=3600";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hamkit.click/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hamkit.click/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.hamkit.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = hamkit.click) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


            listen 80;
                server_name hamkit.click www.hamkit.click;
    gzip_types text/plain text/csv application/csv;
    return 404; # managed by Certbot




}