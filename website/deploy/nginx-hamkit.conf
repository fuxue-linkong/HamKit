# HamKit 官网 —— nginx 站点配置
#
# TLS 证书：由 certbot 写入 /etc/letsencrypt/live/hamkit.click/。
# 首次签发前那里只有自签名占位证书（保证 nginx 能带 443 块启动），
# 签发后 certbot --nginx --force-renewal 会覆盖证书文件而不改动本文件结构。
#
# ACME 校验目录必须用 `location ^~`（前缀匹配优先于正则），
# 且 root 指向 /var/www/certbot —— nginx 会把完整 URI 追加到 root 后，
# 即请求 /.well-known/acme-challenge/xxx 时读取 /var/www/certbot/.well-known/acme-challenge/xxx。

server {
    listen 80;
    listen [::]:80;
    server_name hamkit.click www.hamkit.click;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamkit.click www.hamkit.click;

    ssl_certificate     /etc/letsencrypt/live/hamkit.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hamkit.click/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout      120s;
    }
}
