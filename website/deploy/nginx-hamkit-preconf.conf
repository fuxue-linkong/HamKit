# HamKit 官网 —— nginx 站点配置（certbot 接管前的准备态）
#
# 用法：先用本文件启用站点、切 DNS，然后执行
#   sudo certbot certonly --nginx -d hamkit.click -d www.hamkit.click \
#        --non-interactive --agree-tos --register-unsafely-without-email
# certbot 会填充下方 443 server 块里标注的 ssl_certificate 行（--nginx 会写这些指令）。
# 之后即可把 location / 的 80 端口版本改成 301 跳转。
#
# 注意 ACME 目录用 `location ^~`：非正则优先匹配，避免被 `location /` 的代理规则抢先。

server {
    listen 80;
    listen [::]:80;
    server_name hamkit.click www.hamkit.click;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # 证书签发前：HTTP 全站可访问（Node 后端）
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout      120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hamkit.click www.hamkit.click;

    # 由 certbot 填充：
    # ssl_certificate     /etc/letsencrypt/live/hamkit.click/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hamkit.click/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout      120s;
    }
}
