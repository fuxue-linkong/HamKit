# oauth.hamkit.click —— Casdoor 反向代理（TLS 由 certbot 管理）
#
# 注意：ACME 校验目录必须用 `location ^~`（非正则优先匹配），
# 否则会被 `location /` 的代理规则抢先，导致签发/续期时校验文件被转发给 Casdoor 而失败。
#
# issuer 说明：Casdoor 的 OIDC issuer 由请求 Host 推导，除非其 app.conf 设了 origin。
# 本部署在 Casdoor 的 app.conf 里显式设了 origin = https://oauth.hamkit.click，
# 同时这里也转发 Host 头，双重保险。

server {
    listen 80;
    listen [::]:80;
    server_name oauth.hamkit.click;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name oauth.hamkit.click;

    ssl_certificate     /etc/letsencrypt/live/oauth.hamkit.click/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oauth.hamkit.click/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Casdoor 的 OIDC 回调与令牌交换会带较大的 Cookie/请求头
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout      120s;
    }
}
